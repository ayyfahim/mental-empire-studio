name: Apply automation fixes

on:
  push:
    branches:
      - claude/compose-tab-issues-budb3w

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/compose-tab-issues-budb3w
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply implementation
        run: python .github/automation_fix.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit validated implementation
        run: |
          rm .github/automation_fix.py .github/workflows/apply-automation-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: improve automation selection and reliability"
          git push origin HEAD:claude/compose-tab-issues-budb3w
