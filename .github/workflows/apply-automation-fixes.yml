name: Apply automation fixes

on:
  push:
    branches:
      - claude/compose-tab-issues-budb3w
  pull_request:
    branches:
      - build/mental-empire-studio

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/compose-tab-issues-budb3w
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply implementation
        run: python .github/automation_fix.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck 2>&1 | tee automation-typecheck.log
      - name: Upload typecheck diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: automation-typecheck-diagnostics
          path: automation-typecheck.log
          if-no-files-found: error
      - name: Unit tests
        run: npm test 2>&1 | tee automation-tests.log
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: automation-test-diagnostics
          path: automation-tests.log
          if-no-files-found: error
      - name: Production build
        run: npm run build 2>&1 | tee automation-build.log
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: automation-build-diagnostics
          path: automation-build.log
          if-no-files-found: error
      - name: Commit validated implementation
        if: ${{ github.event_name == 'push' && success() }}
        run: |
          rm -f .github/automation_fix.py .github/automation-trigger .github/workflows/apply-automation-fixes.yml automation-typecheck.log automation-tests.log automation-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: improve automation selection and reliability"
          git push origin HEAD:claude/compose-tab-issues-budb3w
