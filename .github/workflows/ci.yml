name: CI

on:
  push:
    branches: [main, 'build/**']
  pull_request:

# A new push supersedes the previous validation for the same PR/branch. This prevents
# an obsolete real-ffmpeg smoke run from continuing to consume a runner after a fix.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx @electron/rebuild -f -w better-sqlite3
      - run: npm run typecheck
      - run: npm run build
      # Real ffmpeg (libass) for the e2e render test.
      - run: npm run setup:ffmpeg
      - name: Install CI ffmpeg speed shim
        run: |
          set -euo pipefail
          ffmpeg="resources/bin/ffmpeg"
          mv "$ffmpeg" "${ffmpeg}.real"
          cat > "$ffmpeg" <<'SHIM'
          #!/usr/bin/env bash
          set -euo pipefail
          real="$(dirname "$0")/ffmpeg.real"

          # J5/J6a already prove the production 1920x1080 render path. J6b exists to
          # verify the two b-roll graph variants, SFX mixing, codecs, and duration.
          # Keep those two renders real and full-resolution, but force the fastest
          # x264 preset with capped threads on the hosted 2-core runner. Product
          # code and normal renders are untouched.
          target=0
          for arg in "$@"; do
            case "$arg" in
              *beta-bed.mp4|*beta-direct-broll.mp4) target=1 ;;
            esac
          done

          if [[ "$target" -eq 0 ]]; then
            exec "$real" "$@"
          fi

          # Do NOT rewrite resolution. Downscaling the graph's dimension tokens
          # while the real b-roll input clips stay at native size yields a
          # dimensionally-inconsistent filter graph that hangs ffmpeg — the
          # beta-direct-broll variant burned the entire 20m e2e budget that way.
          # Full 1920x1080 renders each finish in ~7s here, so just force the
          # fastest preset and cap threads; leave the arguments otherwise intact.
          args=("$@")
          last=$((${#args[@]} - 1))
          out="${args[$last]}"
          unset 'args[$last]'
          echo "[ci-ffmpeg-shim] fast J6b render (ultrafast, capped threads) -> $out" >&2
          exec "$real" "${args[@]}" -threads 2 -filter_threads 1 -preset ultrafast "$out"
          SHIM
          chmod +x "$ffmpeg"
      # Headless milestone smokes (M2-M7) under a virtual display.
      - name: Smoke harnesses
        run: |
          set -euo pipefail
          F=test/fixtures

          run() {
            local mode="$1"
            local limit="5m"
            local userdata
            local logfile

            # The full real-ffmpeg journey is intentionally heavier than the fixture
            # smokes, but it must still finish in bounded time on a hosted runner.
            if [[ "$mode" == "e2e" ]]; then
              limit="20m"
            fi

            userdata="$(mktemp -d)"
            logfile="/tmp/me-smoke-${mode}.log"

            cleanup() {
              rm -rf "$userdata"
            }
            trap cleanup RETURN

            echo "::group::ME_SMOKE=${mode} (timeout ${limit})"
            if ! timeout --signal=TERM --kill-after=20s "$limit" \
              env ME_SMOKE="$mode" \
                  ME_SMOKE_USERDATA_DIR="$userdata" \
                  ME_YTDLP_FIXTURE="$F/ytdlp" \
                  ME_DOWNLOAD_FIXTURE="$F/audio/sample.mp3" \
                  ME_WHISPER_FIXTURE="$F/whisper/sample-words.json" \
              xvfb-run -a node_modules/electron/dist/electron --no-sandbox out/main/main.js \
              2>&1 | tee "$logfile"; then
              status=${PIPESTATUS[0]}
              echo "Smoke mode ${mode} failed or timed out (status=${status})."
              echo "----- ${logfile} -----"
              cat "$logfile"
              echo "::endgroup::"
              return "${status:-1}"
            fi

            if ! grep -Eq "(SMOKE(_M[0-9])?|E2E)_OK" "$logfile"; then
              echo "Smoke mode ${mode} exited without its success marker."
              cat "$logfile"
              echo "::endgroup::"
              return 1
            fi

            echo "::endgroup::"
          }

          for m in 1 m3 m4 m5 m6 m7 e2e; do
            run "$m"
          done
      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-${{ github.run_id }}
          path: /tmp/me-smoke-*.log
          if-no-files-found: warn
          retention-days: 7
